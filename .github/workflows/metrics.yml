name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: stats-organization/github-readme-stats-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          card: top-langs
          path: github-metrics.svg
          options: username=Dzmi3y&theme=nord_dark&hide=html,css,scss&langs_count=8
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update GitHub Top Languages Chart"
          file_pattern: "github-metrics.svg"
