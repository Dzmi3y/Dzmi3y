<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://w3.org" viewBox="0 0 32 32" width="320" height="320" style="shape-rendering: crispEdges;">
  <style>
    @keyframes type-paw-l {
      0%, 100% { transform: translate(0, 0); }
      33% { transform: translate(-1px, -2px); }
      66% { transform: translate(0, -1px); }
    }
    @keyframes type-paw-r {
      0%, 100% { transform: translate(0, -1px); }
      50% { transform: translate(1px, -3px); }
    }
    @keyframes head-groove {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(1px, 1px); }
    }
    @keyframes code-glow {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.6; }
    }
    @keyframes steam-rise {
      0%, 100% { transform: translateY(0); opacity: 0.3; }
      50% { transform: translateY(-1px) translateX(1px); opacity: 0.8; }
    }
    .paw-l { animation: type-paw-l 0.14s infinite steps(1); transform-origin: 11px 22px; }
    .paw-r { animation: type-paw-r 0.16s infinite steps(1); transform-origin: 21px 22px; }
    .cat-head { animation: head-groove 0.5s infinite steps(1); transform-origin: 16px 14px; }
    .screen-code { animation: code-glow 0.4s infinite steps(1); }
    .coffee-steam { animation: steam-rise 0.7s infinite steps(1); }
  </style>
  <rect x="2" y="2" width="26" height="15" fill="#1a1a24"/>
  <rect x="3" y="3" width="24" height="13" fill="#0d1117"/>
  <rect x="12" y="17" width="6" height="4" fill="#1a1a24"/>
  <g class="screen-code" fill="#00ff66">
    <rect x="5" y="5" width="4" height="1"/>
    <rect x="5" y="7" width="8" height="1"/>
    <rect x="7" y="9" width="5" height="1"/>
    <rect x="5" y="11" width="12" height="1"/>
    <rect x="19" y="5" width="6" height="1" fill="#ff0055"/>
    <rect x="15" y="7" width="4" height="1"/>
    <rect x="19" y="9" width="3" height="1"/>
  </g>
  <rect x="5" y="22" width="20" height="3" fill="#21262d"/> 
  <rect x="6" y="24" width="18" height="1" fill="#00f0ff" opacity="0.8"/> 
  <rect x="9" y="14" width="14" height="10" fill="#d84315"/> 
  <rect x="10" y="15" width="12" height="9" fill="#ff9800"/>  
  <rect x="12" y="16" width="8" height="8" fill="#fff3e0"/>   
  <g class="cat-head">
    <rect x="8" y="7" width="16" height="10" fill="#d84315"/> 
    <rect x="9" y="8" width="14" height="9" fill="#ff9800"/>  
    <rect x="8" y="3" width="4" height="4" fill="#d84315"/>
    <rect x="9" y="4" width="2" height="3" fill="#ffab91"/> 
    <rect x="20" y="3" width="4" height="4" fill="#d84315"/>
    <rect x="21" y="4" width="2" height="3" fill="#ffab91"/>
    <rect x="9" y="12" width="2" height="4" fill="#ffb74d"/>
    <rect x="21" y="12" width="2" height="4" fill="#ffb74d"/>
    <rect x="11" y="10" width="3" height="2" fill="#4caf50"/> 
    <rect x="12" y="10" width="1" height="2" fill="#000000"/> 
    <rect x="11" y="10" width="1" height="1" fill="#ffffff"/> 
    <rect x="18" y="10" width="3" height="2" fill="#4caf50"/> 
    <rect x="19" y="10" width="1" height="2" fill="#000000"/>
    <rect x="18" y="10" width="1" height="1" fill="#ffffff"/>
    <rect x="15" y="12" width="2" height="1" fill="#ffab91"/>
    <rect x="14" y="13" width="4" height="1" fill="#d84315"/>
  </g>
  <rect x="27" y="21" width="4" height="4" fill="#4a148c"/>
  <rect x="26" y="22" width="1" height="2" fill="#4a148c"/>
  <rect x="28" y="21" width="2" height="1" fill="#1a0d00"/>
  <g class="coffee-steam" fill="#ff00ff">
    <rect x="28" y="18" width="1" height="2"/>
    <rect x="29" y="16" width="1" height="2"/>
  </g>
  <g class="paw-l">
    <rect x="9" y="20" width="4" height="4" fill="#d84315"/>
    <rect x="10" y="20" width="2" height="3" fill="#ff9800"/>
    <rect x="10" y="22" width="2" height="2" fill="#fff3e0"/> 
  </g>
  <g class="paw-r">
    <rect x="19" y="20" width="4" height="4" fill="#d84315"/>
    <rect x="20" y="20" width="2" height="3" fill="#ff9800"/>
    <rect x="20" y="22" width="2" height="2" fill="#fff3e0"/>
  </g>
</svg>
